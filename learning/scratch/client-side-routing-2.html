<p id="where"></p>
<button id="watchlist">Watchlist</button>
<button id="settings">Settings</button>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const p = document.querySelector("#where");
    const watchlistButton = document.querySelector('#watchlist');
    const settingsButton = document.querySelector('#settings');

    function show() {
      p.textContent = `You are on ${location.pathname}`;
    }

    window.addEventListener("popstate", show);

    watchlistButton.addEventListener("click", () => {
      history.pushState(null, "", "/watchlist");
    });

    settingsButton.addEventListener("click", () => {
      history.pushState(null, "", "/settings");
    });

    show();
    watchlistButton.click();
    settingsButton.click();
    history.back();
  });
</script>
